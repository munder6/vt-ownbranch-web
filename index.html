<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scratch Cart</title></head>
<body style="font-family: sans-serif; padding: 24px">
  <h1>Your cart</h1>
  <ul id="items"></ul>
  <p id="cart-total" style="font-weight: bold; font-size: 20px"></p>
  <p><a id="continue" href="#">Continue shopping</a></p>
  <p id="secure-note">Secure chekout</p>
  <p id="shipping-note">Free shiping over $50</p>
  <script>
    const items = ["Coffee beans", "Paper filters", "Milk frother"];
    document.getElementById("items").innerHTML = items.map((i) => `<li>${i}</li>`).join("");
    document.getElementById("cart-total").textContent = `Total: ${items.length} items`;
  </script>
</body>
</html>
